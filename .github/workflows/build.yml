name: APRSBox Lite - desktop builds

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            artifact: macos-arm64
          - os: windows-2025
            artifact: windows-x64
          - os: ubuntu-24.04
            artifact: linux-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot rpm

      - name: Install dependencies
        run: npm ci

      - name: Package macOS ARM64 application
        if: runner.os == 'macOS'
        run: npm run package -- --platform=darwin --arch=arm64

      - name: Sign and verify macOS application
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep --sign - 'out/APRSBOX-darwin-arm64/APRSBOX.app'
          codesign --verify --deep --strict --verbose=2 'out/APRSBOX-darwin-arm64/APRSBOX.app'

      - name: Create macOS DMG and ZIP
        if: runner.os == 'macOS'
        run: npm run make -- --from-package --platform=darwin --arch=arm64

      - name: Build Linux packages with Electron Forge
        if: runner.os == 'Linux'
        run: npm run make

      - name: Verify macOS packages
        if: runner.os == 'macOS'
        shell: bash
        run: |
          find out/make -type f -name '*.dmg' -print -quit | grep -q .
          find out/make -type f -name '*.zip' -print -quit | grep -q .

      - name: Verify Linux packages
        if: runner.os == 'Linux'
        shell: bash
        run: |
          find out/make -type f -name '*.deb' -print -quit | grep -q .
          find out/make -type f -name '*.rpm' -print -quit | grep -q .

      - name: Package Windows application with Electron Forge
        if: runner.os == 'Windows'
        run: npm run make:win

      - name: Create Windows portable ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path 'out/APRSBOX-win32-x64/*' -DestinationPath "dist/APRSBoxLite-$version-win-x64.zip"

      - name: Upload installers
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: aprsbox-lite-${{ matrix.artifact }}
          path: |
            out/make/**/*.dmg
            out/make/**/*.zip
            out/make/**/*.deb
            out/make/**/*.rpm
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows portable ZIP
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: aprsbox-lite-${{ matrix.artifact }}
          path: dist/APRSBoxLite-*-win-x64.zip
          if-no-files-found: error
          retention-days: 14
