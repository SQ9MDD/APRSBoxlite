name: APRSBox Lite - desktop builds

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            artifact: macos-arm64
          - os: windows-2025
            artifact: windows-x64
          - os: ubuntu-24.04
            artifact: linux-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot rpm

      - name: Install dependencies
        run: npm ci

      - name: Package macOS ARM64 application
        if: runner.os == 'macOS'
        run: npm run package -- --platform=darwin --arch=arm64

      - name: Sign and verify macOS application
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep --sign - 'out/APRSBOX-darwin-arm64/APRSBOX.app'
          codesign --verify --deep --strict --verbose=2 'out/APRSBOX-darwin-arm64/APRSBOX.app'

      - name: Create macOS application ZIP
        if: runner.os == 'macOS'
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          mkdir -p dist staging
          mv 'out/APRSBOX-darwin-arm64/APRSBOX.app' 'staging/APRSBox Lite.app'
          ditto -c -k --sequesterRsrc --keepParent 'staging/APRSBox Lite.app' "dist/APRSBoxLite-${version}-macOS-arm64.zip"
          mkdir -p verify-macos
          ditto -x -k "dist/APRSBoxLite-${version}-macOS-arm64.zip" verify-macos
          codesign --verify --deep --strict --verbose=2 'verify-macos/APRSBox Lite.app'

      - name: Build Linux packages with Electron Forge
        if: runner.os == 'Linux'
        run: npm run make

      - name: Verify macOS application ZIP
        if: runner.os == 'macOS'
        shell: bash
        run: |
          test -d 'staging/APRSBox Lite.app'
          find dist -type f -name 'APRSBoxLite-*-macOS-arm64.zip' -print -quit | grep -q .

      - name: Verify Linux packages
        if: runner.os == 'Linux'
        shell: bash
        run: |
          find out/make -type f -name '*.deb' -print -quit | grep -q .
          find out/make -type f -name '*.rpm' -print -quit | grep -q .

      - name: Package Windows application with Electron Forge
        if: runner.os == 'Windows'
        run: npm run make:win

      - name: Create Windows portable ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $source = (Resolve-Path 'out/APRSBOX-win32-x64').Path
          $destination = Join-Path (Resolve-Path 'dist').Path "APRSBoxLite-$version-win-x64.zip"
          [System.IO.Compression.ZipFile]::CreateFromDirectory($source, $destination, [System.IO.Compression.CompressionLevel]::Optimal, $false)

      - name: Upload macOS application ZIP
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          path: dist/APRSBoxLite-*-macOS-arm64.zip
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows portable ZIP
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          path: dist/APRSBoxLite-*-win-x64.zip
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux DEB package
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          path: out/make/**/*.deb
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux RPM package
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          path: out/make/**/*.rpm
          archive: false
          if-no-files-found: error
          retention-days: 14
