name: APRSBox Lite - controlled release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.0)'
        required: true
        type: string
      release_type:
        description: 'Release type'
        required: true
        type: choice
        default: draft
        options:
          - draft
          - prerelease
          - release

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            artifact: macos-arm64
          - os: windows-2025
            artifact: windows-x64
          - os: ubuntu-24.04
            artifact: linux-x64
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout selected revision
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm

      - name: Validate version
        shell: bash
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo 'Use a semantic version without a leading v, for example 0.1.0 or 0.1.1-beta.' >&2
            exit 1
          fi

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot rpm

      - name: Install dependencies
        run: npm ci

      - name: Set build version
        shell: bash
        run: npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version --ignore-scripts

      - name: Package macOS ARM64 application
        if: runner.os == 'macOS'
        run: npm run package -- --platform=darwin --arch=arm64

      - name: Sign, verify and archive macOS application
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p release-files staging
          mv 'out/APRSBOX-darwin-arm64/APRSBOX.app' 'staging/APRSBox Lite.app'
          codesign --force --deep --sign - 'staging/APRSBox Lite.app'
          codesign --verify --deep --strict --verbose=2 'staging/APRSBox Lite.app'
          ditto -c -k --sequesterRsrc --keepParent 'staging/APRSBox Lite.app' "release-files/APRSBoxLite-${RELEASE_VERSION}-macOS-arm64.zip"

      - name: Package Windows x64 application
        if: runner.os == 'Windows'
        run: npm run make:win

      - name: Archive Windows application directory
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-files | Out-Null
          Compress-Archive -Path 'out/APRSBOX-win32-x64' -DestinationPath "release-files/APRSBoxLite-$env:RELEASE_VERSION-Windows-x64.zip"

      - name: Build Linux packages
        if: runner.os == 'Linux'
        run: npm run make

      - name: Upload macOS and Windows release files
        if: runner.os != 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.artifact }}
          path: release-files/*.zip
          if-no-files-found: error
          retention-days: 1

      - name: Upload Linux release files
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.artifact }}
          path: |
            out/make/**/*.deb
            out/make/**/*.rpm
          if-no-files-found: error
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_TYPE: ${{ inputs.release_type }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout selected revision
        uses: actions/checkout@v7

      - name: Download build files
        uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: release-files
          merge-multiple: true

      - name: Create or verify tag and publish release
        shell: bash
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          git check-ref-format "refs/tags/$tag"
          mapfile -d '' files < <(find release-files -type f -print0)
          test -f "release-files/APRSBoxLite-${RELEASE_VERSION}-macOS-arm64.zip"
          test -f "release-files/APRSBoxLite-${RELEASE_VERSION}-Windows-x64.zip"
          find release-files -type f -name '*.deb' -print -quit | grep -q .
          find release-files -type f -name '*.rpm' -print -quit | grep -q .

          remote_tag="$(git ls-remote --refs origin "refs/tags/$tag")"
          if [[ -n "$remote_tag" ]]; then
            git fetch --no-tags origin "refs/tags/$tag"
            tag_commit="$(git rev-parse 'FETCH_HEAD^{commit}')"
            if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
              echo "Tag $tag already points to a different commit." >&2
              exit 1
            fi
          else
            git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
          fi

          flags=()
          case "$RELEASE_TYPE" in
            draft) flags+=(--draft) ;;
            prerelease) flags+=(--prerelease) ;;
            release) ;;
            *) echo 'Invalid release type.' >&2; exit 1 ;;
          esac
          gh release create "$tag" "${files[@]}" --verify-tag --title "APRSBox Lite $RELEASE_VERSION" "${flags[@]}"
